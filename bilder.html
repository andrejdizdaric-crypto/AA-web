<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsere Bilder 📸</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7, #ff758c);
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    a {
      margin-top: 40px;
      display: inline-block;
      padding: 12px 25px;
      background: #fff;
      color: #e91e63;
      border-radius: 40px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    /* Popup Hintergrund */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Großes Bild */
    .popup img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255,255,255,0.3);
      animation: fadeIn 0.3s ease;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }


  </style>
</head>
<body>

<h1>Unsere schönsten Momente 📸</h1>

<div class="gallery">
  <img src="bilder/Bild%201.jpeg" onclick="openImage(this.src)">
  <img src="bilder/Bild%202.jpeg" onclick="openImage(this.src)">
  <img src="bilder/Bild%203.jpeg" onclick="openImage(this.src)">
  <img src="bilder/Bild%204.jpeg" onclick="openImage(this.src)">
  <img src="bilder/Bild%205.jpeg" onclick="openImage(this.src)">
  <img src="bilder/Bild%206.jpeg" onclick="openImage(this.src)">
</div>

<!-- Popup / Lightbox -->
<div id="popup" class="popup" onclick="closeImage()">
  <img id="popup-img">
</div>


<script>
  function openImage(src) {
    document.getElementById("popup-img").src = src;
    document.getElementById("popup").style.display = "flex";
  }

  function closeImage() {
    document.getElementById("popup").style.display = "none";
  }
</script>



</body>
</html>
